# Local development environment only. Ports bind to this machine, never the network.
# Secrets come from backend/.env, which is gitignored. See .env.example.
# Never use shell -x here: expanded credentials can appear in Docker container logs.
name: shinobi-dominion

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  nakama:
    build:
      context: ..
      dockerfile: backend/nakama/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama --name sd1
        --database.address postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama
        --logger.level INFO
        --session.token_expiry_sec 7200
        --socket.server_key ${SD_SERVER_KEY}
        --session.encryption_key ${SD_SESSION_KEY}
        --session.refresh_encryption_key ${SD_REFRESH_KEY}
        --runtime.http_key ${SD_HTTP_KEY}
        --console.username ${SD_CONSOLE_USER}
        --console.password ${SD_CONSOLE_PASSWORD}
        --console.signing_key ${SD_CONSOLE_KEY}
        --runtime.env SD_DEV_MODE=${SD_DEV_MODE:-false}
        --runtime.env SD_RATE_PER_SEC=${SD_RATE_PER_SEC:-5}
        --runtime.env SD_RATE_BURST=${SD_RATE_BURST:-20}
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m

  tests:
    profiles: ["test"]
    image: heroiclabs/nakama-pluginbuilder:3.42.0
    entrypoint: ["go"]
    working_dir: /tests
    volumes:
      - ./tests:/tests
    environment:
      NAKAMA_URL: http://nakama:7350
      SD_SERVER_KEY: ${SD_SERVER_KEY}
      SD_HTTP_KEY: ${SD_HTTP_KEY}
      CGO_ENABLED: "0"
    command: ["test", "-count=1", "-timeout=540s", "./..."]

volumes:
  pgdata:
